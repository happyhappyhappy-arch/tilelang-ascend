name: Build AscendNPU-IR

on:
  workflow_call:
    outputs:
      cache-key:
        description: "Cache key for the NPUIR prebuild"
        value: ${{ jobs.build-npuir.outputs.cache-key }}
      npuir-commit:
        description: "AscendNPU-IR commit hash"
        value: ${{ jobs.build-npuir.outputs.npuir-commit }}
  workflow_dispatch:

env:
  NPUIR_INSTALL_DIR: npuir-prebuild

jobs:
  build-npuir:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    outputs:
      cache-key: ${{ steps.cache-key.outputs.key }}
      npuir-commit: ${{ steps.npuir-version.outputs.commit }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: Initialize AscendNPU-IR submodule (non-recursive)
      run: |
        git submodule update --init 3rdparty/AscendNPU-IR
        cd 3rdparty/AscendNPU-IR
        git submodule update --init

    - name: Get AscendNPU-IR commit ID
      id: npuir-version
      run: |
        NPUIR_COMMIT=$(git -C 3rdparty/AscendNPU-IR rev-parse HEAD)
        echo "commit=${NPUIR_COMMIT}" >> "$GITHUB_OUTPUT"
        echo "AscendNPU-IR commit: ${NPUIR_COMMIT}"

    - name: Compute cache key
      id: cache-key
      run: echo "key=npuir-prebuild-${{ steps.npuir-version.outputs.commit }}" >> "$GITHUB_OUTPUT"

    - name: Restore NPUIR prebuild from cache
      id: cache
      uses: actions/cache@v4
      with:
        path: ${{ env.NPUIR_INSTALL_DIR }}
        key: ${{ steps.cache-key.outputs.key }}

    - name: Install build dependencies
      if: steps.cache.outputs.cache-hit != 'true'
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          clang \
          lld \
          cmake \
          make \
          libzstd-dev \
          zlib1g-dev \
          patch

    - name: Apply patches
      if: steps.cache.outputs.cache-hit != 'true'
      working-directory: 3rdparty/AscendNPU-IR
      run: bash ./build-tools/apply_patches.sh

    - name: Configure AscendNPU-IR
      if: steps.cache.outputs.cache-hit != 'true'
      working-directory: 3rdparty/AscendNPU-IR
      run: |
        NPUIR_ROOT=$(pwd)
        cmake third-party/llvm-project/llvm -B build \
          -DCMAKE_C_COMPILER=clang \
          -DCMAKE_CXX_COMPILER=clang++ \
          -DCMAKE_BUILD_TYPE=Release \
          -DLLVM_ENABLE_PROJECTS="mlir" \
          -DLLVM_EXTERNAL_PROJECTS="bishengir" \
          -DLLVM_EXTERNAL_BISHENGIR_SOURCE_DIR="${NPUIR_ROOT}" \
          -DLLVM_TARGETS_TO_BUILD="host" \
          -DLLVM_ENABLE_ASSERTIONS=OFF \
          -DMLIR_ENABLE_BINDINGS_PYTHON=OFF \
          -DLLVM_INSTALL_UTILS=ON \
          -DCMAKE_INSTALL_PREFIX="${NPUIR_ROOT}/build/install" \
          -DBSPUB_DAVINCI_BISHENGIR=ON \
          -DBISHENGIR_PUBLISH=OFF \
          -DCMAKE_LINKER=lld \
          -DLLVM_ENABLE_LLD=ON

    - name: Build AscendNPU-IR
      if: steps.cache.outputs.cache-hit != 'true'
      working-directory: 3rdparty/AscendNPU-IR
      run: cmake --build build -j$(nproc)

    - name: Install AscendNPU-IR
      if: steps.cache.outputs.cache-hit != 'true'
      working-directory: 3rdparty/AscendNPU-IR
      run: cmake --install build

    - name: Populate cache directory
      if: steps.cache.outputs.cache-hit != 'true'
      run: cp -r 3rdparty/AscendNPU-IR/build/install/* ${{ env.NPUIR_INSTALL_DIR }}/
